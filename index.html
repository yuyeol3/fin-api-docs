<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fin API 명세</title>
<meta name="description" content="Fin 백엔드 HTTP API 명세. 원본은 README.md와 docs/*.md 마크다운입니다.">
<link rel="alternate" type="text/markdown" href="README.md" title="명세 원문 (Markdown)">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<style>
  /* 색은 Fin-FE(src) 기준 */
  :root {
    --mint: #03BFA5;
    --mint-dark: #02A892;
    --mint-soft: #EFFFFD;
    --mint-line: #BFEFE8;
    --text: #454545;
    --strong: #26313A;
    --muted: #7A7A7A;
    --line: #E4E4E4;
    --soft: #F7F8F8;
    --sidebar: 300px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 24px; }
  body {
    margin: 0;
    background: #fff;
    color: var(--text);
    font-family: "Pretendard", -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    font-size: 15.5px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--mint-dark); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* 사이드 목차 */
  .toc {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: var(--sidebar);
    padding: 32px 20px 40px;
    border-right: 1px solid var(--line);
    overflow-y: auto;
    font-size: 14px;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin: 0 8px 24px; }
  .brand:hover { text-decoration: none; }
  .toc-toggle { display: none; }
  .brand img { height: 28px; }
  .brand span { color: var(--muted); font-size: 13px; font-weight: 500; padding-top: 3px; }

  /* 접히는 목차 그룹 */
  .toc details { margin: 1px 0; }
  .toc summary {
    list-style: none; display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; border-radius: 6px; cursor: pointer;
    font-size: 13.5px; font-weight: 700; color: var(--strong);
  }
  .toc summary::-webkit-details-marker { display: none; }
  .toc summary::before {
    content: ""; flex-shrink: 0; width: 6px; height: 6px; margin: 0 2px;
    border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
    transform: rotate(-45deg); transition: transform 0.15s;
  }
  .toc details[open] > summary::before { transform: rotate(45deg); }
  .toc summary:hover { background: var(--soft); }
  .toc summary a { flex: 1; color: inherit; }
  .toc summary a:hover { color: var(--mint-dark); text-decoration: none; }
  .toc summary .count { color: var(--muted); font-size: 12px; font-weight: 500; }
  .toc ul { list-style: none; margin: 2px 0 10px 14px; padding: 0; }
  .toc li { margin: 1px 0; }
  .toc li a {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 10px; border-radius: 6px;
    color: var(--muted);
  }
  .toc li a:hover { color: var(--strong); background: var(--soft); text-decoration: none; }
  .toc li a.active { color: var(--mint-dark); background: var(--mint-soft); font-weight: 600; }
  .toc li a code { font-family: inherit; font-size: 13px; background: none; padding: 0; overflow-wrap: anywhere; color: inherit; }
  .toc .links { margin-top: 28px; padding: 16px 10px 0; border-top: 1px solid var(--line); display: grid; gap: 4px; }
  .toc .links a { color: var(--text); }

  /* 메서드 배지 */
  .method {
    display: inline-block; min-width: 54px; padding: 2px 0;
    border-radius: 6px; text-align: center;
    font-size: 12px; font-weight: 700; letter-spacing: 0.02em;
    color: #5F5F5F; background: #F0F0F0;
  }
  .toc .method { min-width: 42px; font-size: 10px; padding: 1px 0; flex-shrink: 0; }
  /* 파스텔 배경에 같은 색 계열의 진한 글자 (12px 굵은 글씨에서 대비 4.5:1 이상) */
  .method.get { color: #017A6B; background: #DDF6F1; }
  .method.post { color: #22609C; background: #E2EEFA; }
  .method.put, .method.patch { color: #95550A; background: #FCEEDA; }
  .method.delete { color: #A82E43; background: #FBE4E8; }

  /* 본문 */
  main { margin-left: var(--sidebar); padding: 56px 48px 96px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1, h2, h3 { color: var(--strong); letter-spacing: -0.01em; }
  /* 랜딩: README의 제목·소개와 문서 목록 카드 */
  .hero h1 { font-size: 34px; line-height: 1.3; margin: 0 0 10px; }
  .hero p { font-size: 16.5px; }
  .hero ul { list-style: none; padding: 0; margin: 12px 0 0; color: var(--muted); font-size: 14px; }
  .domain-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 12px; margin: 32px 0 0;
  }
  .domain-card {
    display: flex; flex-direction: column; gap: 6px;
    padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px;
    color: var(--text); background: #fff;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
  }
  .domain-card:hover {
    text-decoration: none; border-color: var(--mint);
    box-shadow: 0 6px 18px rgba(3, 191, 165, 0.12); transform: translateY(-1px);
  }
  .domain-card strong { font-size: 16px; }
  .domain-card .desc { flex: 1; font-size: 13.5px; color: var(--muted); line-height: 1.55; }
  .domain-card .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
  .domain-card .meta .method { min-width: 0; padding: 0 6px; font-size: 10px; }
  .domain-card .meta span:last-child { margin-left: auto; }
  .doc > h1 {
    font-size: 26px; margin: 0 0 8px; padding-bottom: 10px;
    border-bottom: 2px solid var(--mint);
  }
  #overview h2 { font-size: 22px; margin: 80px 0 10px; }
  #overview h3 { font-size: 17px; margin: 28px 0 8px; }

  .endpoint { margin: 40px 0 0; padding: 22px 24px 18px; border: 1px solid var(--line); border-radius: 12px; }
  .endpoint > h2 { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 6px; font-size: 18px; }
  .endpoint > h2 code { font-size: 17px; background: none; padding: 0; color: var(--strong); font-weight: 600; overflow-wrap: anywhere; }
  .endpoint h3 { font-size: 14px; margin: 22px 0 6px; color: var(--muted); font-weight: 700; }
  .endpoint > p:first-of-type { margin-top: 4px; }

  .auth { display: inline-flex; align-items: center; gap: 6px; list-style: none; padding: 0; margin: 6px 0 4px; font-size: 13.5px; }
  .auth li { margin: 0; }
  .tag { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--line); color: var(--muted); background: #fff; }
  .tag.login { color: var(--mint-dark); border-color: var(--mint-line); background: var(--mint-soft); }
  .tag.agreed { color: #fff; border-color: var(--mint); background: var(--mint); }

  p { margin: 8px 0; }
  ul, ol { margin: 6px 0 10px; padding-left: 22px; }
  li { margin: 3px 0; }
  strong { font-weight: 650; color: var(--strong); }

  .table-scroll { overflow-x: auto; margin: 8px 0 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: var(--soft); font-weight: 600; color: var(--strong); white-space: nowrap; }
  td code { white-space: nowrap; }

  code { font-family: "JetBrains Mono", Consolas, "D2Coding", monospace; font-size: 0.88em; background: var(--soft); padding: 1px 5px; border-radius: 4px; color: var(--strong); }
  pre {
    margin: 8px 0 12px; padding: 14px 16px; overflow-x: auto;
    background: var(--soft); border: 1px solid var(--line); border-radius: 8px;
    font-size: 13px; line-height: 1.6;
  }
  pre code { background: none; padding: 0; font-size: inherit; }

  .status { color: var(--muted); }
  .status a { color: var(--mint-dark); }

  /* 문서 끝의 이전/다음 문서 링크 */
  .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 64px; }
  .pager a {
    display: flex; flex-direction: column; gap: 2px;
    padding: 14px 18px; border: 1px solid var(--line); border-radius: 12px;
    color: var(--strong); font-weight: 650;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .pager a:hover { text-decoration: none; border-color: var(--mint); box-shadow: 0 6px 18px rgba(3, 191, 165, 0.12); }
  .pager span { color: var(--muted); font-size: 13px; font-weight: 500; }
  .pager .next { grid-column: 2; text-align: right; }

  footer { margin-top: 72px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }

  @media (max-width: 900px) {
    .toc { position: static; width: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 20px 16px; }
    .toc-head { display: flex; align-items: center; justify-content: space-between; }
    .brand { margin: 0 8px; }
    .toc-toggle {
      display: block; padding: 6px 14px; border: 1px solid var(--line); border-radius: 8px;
      background: #fff; color: var(--text); font: inherit; font-size: 13.5px;
    }
    .toc.expanded .toc-toggle { color: var(--mint-dark); border-color: var(--mint); }
    .toc:not(.expanded) > details, .toc:not(.expanded) > .links { display: none; }
    .toc.expanded .toc-head { margin-bottom: 12px; }
    main { margin-left: 0; padding: 28px 16px 64px; }
    .endpoint { padding: 18px 16px 14px; }
    .pager { grid-template-columns: 1fr; }
    .pager .next { grid-column: 1; }
  }
</style>
</head>
<body>
<nav class="toc" id="toc">
  <div class="toc-head">
    <a class="brand" href="#"><img src="assets/logo.png" alt="Fin"><span>API 명세</span></a>
    <button type="button" class="toc-toggle" aria-expanded="false" onclick="this.setAttribute('aria-expanded', document.getElementById('toc').classList.toggle('expanded'))">목차</button>
  </div>
</nav>
<main>
  <div class="wrap" id="content">
    <p class="status">명세를 불러오는 중입니다. 원문은 <a href="README.md">README.md</a>와 거기서 링크한 docs/*.md 마크다운이며, 작성 규칙은 <a href="AGENTS.md">AGENTS.md</a>에 있습니다.</p>
  </div>
</main>
<script>
const METHOD_HEADING = /^(GET|POST|PUT|PATCH|DELETE)\s+(\S+)$/;
const AUTH_TAG = { '공개': 'public', '로그인': 'login', '약관 동의': 'agreed' };

// AGENTS.md의 앵커 규칙과 같다: 소문자, 영문·숫자·한글 외 문자는 '-'
function slug(text) {
  return text.toLowerCase().replace(/[^a-z0-9가-힣]+/g, '-').replace(/^-+|-+$/g, '');
}

async function fetchText(path) {
  const res = await fetch(path, { cache: 'no-cache' });
  if (!res.ok) throw new Error(`${path}: ${res.status}`);
  return res.text();
}

// 엔드포인트(## METHOD /path)마다 다음 ## 전까지를 카드로 묶고 배지를 붙인다.
function decorateEndpoints(section) {
  for (const h2 of [...section.querySelectorAll(':scope > h2')]) {
    const m = h2.textContent.trim().match(METHOD_HEADING);
    if (!m) continue;
    const [, method, path] = m;
    h2.id = slug(`${method} ${path}`);
    h2.dataset.method = method;
    h2.dataset.path = path;
    h2.innerHTML = `<span class="method ${method.toLowerCase()}">${method}</span><code></code>`;
    h2.querySelector('code').textContent = path;

    const card = document.createElement('article');
    card.className = 'endpoint';
    h2.before(card);
    let node = h2;
    while (node && !(node !== h2 && /^H[12]$/.test(node.tagName))) {
      const next = node.nextElementSibling;
      card.append(node);
      node = next;
    }

    const authItem = [...card.querySelectorAll(':scope > ul > li')].find(li => li.textContent.startsWith('인증:'));
    if (authItem) {
      const raw = authItem.textContent.replace('인증:', '').trim();
      const level = Object.keys(AUTH_TAG).find(k => raw.startsWith(k));
      if (level) {
        const rest = raw.slice(level.length).trim();
        authItem.innerHTML = `인증 <span class="tag ${AUTH_TAG[level]}">${level}</span> `;
        authItem.append(rest);
        authItem.parentElement.classList.add('auth');
      }
    }
  }
}

// 마크다운끼리의 상대 링크를 페이지 안 앵커로 바꾼다.
function rewriteLinks(root) {
  for (const a of root.querySelectorAll('a[href]')) {
    const href = a.getAttribute('href');
    if (/^https?:/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; continue; }
    const m = href.match(/(?:^|\/)([\w-]+)\.md(#.*)?$/);
    if (!m) continue;
    const [, name, hash] = m;
    a.setAttribute('href', hash || (name === 'README' ? '#overview' : `#${name}`));
  }
}

// README에서 첫 ## 전까지는 히어로로 묶고, `## 문서 목록`의 목록은 도메인 카드로 바꾼다.
function buildLanding(content) {
  const overview = content.querySelector('#overview');
  const hero = document.createElement('header');
  hero.className = 'hero';
  overview.prepend(hero);
  while (hero.nextElementSibling && hero.nextElementSibling.tagName !== 'H2') {
    hero.append(hero.nextElementSibling);
  }

  const listHeading = [...overview.querySelectorAll(':scope > h2')].find(h => h.textContent.trim() === '문서 목록');
  const list = listHeading?.nextElementSibling;
  if (!list || list.tagName !== 'UL') return;

  const grid = document.createElement('nav');
  grid.className = 'domain-grid';
  for (const li of list.children) {
    const link = li.querySelector('a');
    const id = link?.getAttribute('href').match(/([\w-]+)\.md$/)?.[1];
    const section = id && document.getElementById(id);
    if (!section) continue;
    const methods = [...section.querySelectorAll('.endpoint > h2')].map(h => h.dataset.method);

    const card = document.createElement('a');
    card.className = 'domain-card';
    card.href = `#${id}`;
    card.innerHTML = '<strong></strong><span class="desc"></span><span class="meta"></span>';
    card.querySelector('strong').textContent = link.textContent;
    card.querySelector('.desc').textContent = li.textContent.replace(link.textContent, '').replace(/^\s*:\s*/, '');
    const meta = card.querySelector('.meta');
    for (const m of new Set(methods)) {
      meta.insertAdjacentHTML('beforeend', `<span class="method ${m.toLowerCase()}">${m}</span>`);
    }
    meta.insertAdjacentHTML('beforeend', `<span>엔드포인트 ${methods.length}개</span>`);
    grid.append(card);
  }
  hero.append(grid);
  listHeading.remove();
  list.remove();
}

// 랜딩과 도메인 문서를 문서 목록 순서로 잇는 이전/다음 링크를 각 문서 끝에 붙인다.
function addPagers(content) {
  const sections = [...content.querySelectorAll('#overview, section.doc')];
  sections.forEach((sec, i) => {
    const pager = document.createElement('nav');
    pager.className = 'pager';
    for (const [other, cls, label] of [[sections[i - 1], 'prev', '← 이전'], [sections[i + 1], 'next', '다음 →']]) {
      if (!other) continue;
      const a = document.createElement('a');
      a.className = cls;
      a.href = `#${other.id}`;
      a.innerHTML = `<span>${label}</span>`;
      a.append(other.querySelector('h1').textContent);
      pager.append(a);
    }
    sec.append(pager);
  });
}

function goTo(id) {
  if (decodeURIComponent(location.hash.slice(1)) === id) showRoute();
  else location.hash = id;
}

// 그룹마다 <details>로 접는다. 그룹 제목을 누르면 그 위치로 가면서 펼친다.
function buildToc(content) {
  const toc = document.getElementById('toc');
  const addGroup = (label, targetId, headings) => {
    const details = document.createElement('details');
    details.innerHTML = '<summary><a></a><span class="count"></span></summary><ul></ul>';
    const titleLink = details.querySelector('summary a');
    titleLink.href = `#${targetId}`;
    titleLink.textContent = label;
    titleLink.addEventListener('click', e => {
      e.preventDefault();
      autoOpen(details);
      goTo(targetId);
    });
    details.querySelector('summary').addEventListener('click', e => {
      if (e.target !== titleLink) delete details.dataset.auto;
    });
    details.querySelector('.count').textContent = headings.length;

    const ul = details.querySelector('ul');
    for (const h of headings) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = `#${h.id}`;
      if (h.dataset.method) {
        a.innerHTML = `<span class="method ${h.dataset.method.toLowerCase()}">${h.dataset.method}</span><code></code>`;
        a.querySelector('code').textContent = h.dataset.path;
      } else {
        a.textContent = h.textContent;
      }
      li.append(a);
      ul.append(li);
    }
    toc.append(details);
  };

  // README의 ## 절(공통 규칙)은 그 아래 ### 들을 항목으로 둔다.
  content.querySelectorAll('#overview > h2').forEach(h2 => {
    const subs = [];
    for (let n = h2.nextElementSibling; n && n.tagName !== 'H2'; n = n.nextElementSibling) {
      if (n.tagName === 'H3') subs.push(n);
    }
    addGroup(h2.textContent, h2.id, subs);
  });

  content.querySelectorAll('section.doc').forEach(sec => {
    addGroup(sec.querySelector('h1').textContent, sec.id, [...sec.querySelectorAll('.endpoint > h2')]);
  });

  // 모바일에서 펼친 목차는 항목으로 이동하면 다시 접는다.
  toc.addEventListener('click', e => {
    if (e.target.closest('details a, .brand')) {
      toc.classList.remove('expanded');
      toc.querySelector('.toc-toggle').setAttribute('aria-expanded', 'false');
    }
  });

  const links = document.createElement('div');
  links.className = 'links';
  links.innerHTML = `
    <a href="https://github.com/yuyeol3/fin-api-docs" target="_blank" rel="noopener">GitHub 저장소</a>
    <a href="README.md">마크다운 원문</a>
    <a href="https://github.com/ApptiveDev/Fin-BE" target="_blank" rel="noopener">Fin-BE</a>`;
  toc.append(links);
}

function trackActive(content) {
  const linkFor = new Map([...document.querySelectorAll('.toc li a')].map(a => [a.getAttribute('href').slice(1), a]));
  const observer = new IntersectionObserver(entries => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      const a = linkFor.get(e.target.id);
      if (!a) continue;
      document.querySelectorAll('.toc a.active').forEach(x => x.classList.remove('active'));
      a.classList.add('active');
      autoOpen(a.closest('details'));
    }
  }, { rootMargin: '0px 0px -75% 0px' });
  for (const id of linkFor.keys()) observer.observe(document.getElementById(id));
}

// 스크롤 위치에 따라 연 그룹은 다음 그룹이 열릴 때 다시 접는다. 직접 연 그룹은 그대로 둔다.
function autoOpen(group) {
  for (const g of document.querySelectorAll('.toc details[data-auto]')) {
    if (g !== group) { g.open = false; delete g.dataset.auto; }
  }
  if (!group.open) { group.open = true; group.dataset.auto = ''; }
}

async function render() {
  const content = document.getElementById('content');
  try {
    const readme = await fetchText('README.md');
    const docPaths = [...new Set([...readme.matchAll(/\]\((docs\/[\w-]+\.md)\)/g)].map(m => m[1]))];
    const docs = await Promise.all(docPaths.map(fetchText));

    const sections = [`<section id="overview">${marked.parse(readme)}</section>`];
    docPaths.forEach((path, i) => {
      const id = path.match(/([\w-]+)\.md$/)[1];
      sections.push(`<section class="doc" id="${id}">${marked.parse(docs[i])}</section>`);
    });
    content.innerHTML = sections.join('') +
      `<footer>이 페이지는 마크다운 원문을 그대로 렌더링합니다. 수정은 <a href="https://github.com/yuyeol3/fin-api-docs" target="_blank" rel="noopener">저장소</a>의 마크다운에서 합니다.</footer>`;
  } catch (e) {
    content.innerHTML = `<p class="status">명세를 불러오지 못했습니다 (${e.message}). 로컬에서는 <code>python -m http.server</code>로 띄워서 엽니다.</p>`;
    return;
  }

  content.querySelectorAll('section.doc').forEach(decorateEndpoints);
  buildLanding(content);
  addPagers(content);
  content.querySelectorAll('#overview > h2, #overview > h3').forEach(h => { h.id = slug(h.textContent); });
  content.querySelectorAll('table').forEach(t => {
    const wrap = document.createElement('div');
    wrap.className = 'table-scroll';
    t.before(wrap);
    wrap.append(t);
  });
  rewriteLinks(content);
  buildToc(content);
  trackActive(content);
  window.addEventListener('hashchange', showRoute);
  showRoute();
}

// 주소 해시가 가리키는 요소가 든 문서(랜딩 또는 도메인 하나)만 보여준다.
// 해시가 없거나 없는 id면 랜딩을 보여준다.
function showRoute() {
  const id = decodeURIComponent(location.hash.slice(1));
  const target = id ? document.getElementById(id) : null;
  const section = target?.closest('#overview, section.doc') ?? document.getElementById('overview');
  document.querySelectorAll('#overview, section.doc').forEach(s => { s.hidden = s !== section; });

  if (target && target !== section) target.scrollIntoView({ behavior: 'instant' });
  else window.scrollTo({ top: 0, behavior: 'instant' });

  const groupLink = document.querySelector(`.toc summary a[href="#${section.id}"]`);
  if (groupLink) autoOpen(groupLink.closest('details'));
}

render();
</script>
</body>
</html>
